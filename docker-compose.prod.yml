x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    container_name: itam-mysql-prod
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --default-time-zone=${MYSQL_TIMEZONE:-+08:00}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./itam-system
    container_name: itam-backend-prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_ECHO: ${DB_ECHO:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      LOGIN_LOCK_THRESHOLD: ${LOGIN_LOCK_THRESHOLD:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_AUDITOR_PASSWORD: ${INITIAL_AUDITOR_PASSWORD}
      INIT_DATABASE_TOKEN: ${INIT_DATABASE_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-120}
      MAX_ASSETS_PER_USER: ${MAX_ASSETS_PER_USER:-5}
      HIGH_VALUE_THRESHOLD: ${HIGH_VALUE_THRESHOLD:-50000}
      IDLE_DAYS_THRESHOLD: ${IDLE_DAYS_THRESHOLD:-90}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip}
      UPLOAD_DIR: /app/uploads
      APP_CONFIG_DIR: /app/runtime
      AUDIT_REPORT_PATH: /app/reports/audit_report.html
    volumes:
      - uploads_prod:/app/uploads
      - reports_prod:/app/reports
      - backend_runtime_prod:/app/runtime
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./itam-frontend
      args:
        VITE_API_BASE_URL: /backend
        VITE_MOBILE_PUBLIC_URL: ${VITE_MOBILE_PUBLIC_URL:-}
        VITE_FEISHU_SDK_URL: ${VITE_FEISHU_SDK_URL:-}
        VITE_FEISHU_SDK_AUTO_LOAD: ${VITE_FEISHU_SDK_AUTO_LOAD:-}
    container_name: itam-frontend-prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    container_name: itam-backup-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backups_prod:/backups
      - uploads_prod:/uploads:ro

volumes:
  mysql_data_prod:
  uploads_prod:
  reports_prod:
  backend_runtime_prod:
  backups_prod:

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./itam-system:/app

  frontend:
    build:
      context: ./itam-frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: /backend
      VITE_MOBILE_PUBLIC_URL: ${VITE_MOBILE_PUBLIC_URL:-}
      VITE_FEISHU_SDK_URL: ${VITE_FEISHU_SDK_URL:-}
      VITE_FEISHU_SDK_AUTO_LOAD: ${VITE_FEISHU_SDK_AUTO_LOAD:-}
      CHOKIDAR_USEPOLLING: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./itam-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_vite_cache:/app/node_modules/.vite

volumes:
  frontend_node_modules:
  frontend_vite_cache:
